# pytest configuration for the apex plugin repo.
#
# --import-mode=importlib
#   The layout is skills/<skill>/reference/tests/, and those directories carry no
#   __init__.py. Under pytest's default "prepend" import mode a test module's name
#   is derived from its BASENAME alone, so two skills that each add a
#   conventionally-named test file claim the same module name: the first collected
#   wins and the second fails with "import file mismatch". It already happened once
#   (detect-stack and investigate-bug both ship test_review_fixes.py), and it cost
#   7 tests that never ran.
#
#   Renaming a file or adding __init__.py fixes one collision. importlib mode fixes
#   the class of them: module names are derived from the full path, so same-named
#   test files in different skills no longer collide. Every new skill added under
#   this layout would otherwise be one more chance to rediscover the problem — and
#   it fails loudly only for the SECOND file, so it surfaces one skill at a time.
#
#   The usual blocker for importlib mode is `from conftest import ...`, which it
#   breaks. This repo has no conftest.py files and no conftest imports.
#
# Why pytest.ini and not [tool.pytest.ini_options] in pyproject.toml: this repo is
# a Claude Code plugin, not a Python project, and has no pyproject.toml. Adding one
# that carries only a [tool.*] table breaks `uv run` outright — uv rejects it with
# "No `project` table found" — so the tests would stop running under the very
# command used to invoke them.
[pytest]
addopts = --import-mode=importlib
