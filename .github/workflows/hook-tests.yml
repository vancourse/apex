# The plugin's own suite, on Linux AND Windows (design R19): the hooks run on a
# Windows box with PowerShell 5.1 and backslash paths, and a gate calibrated only
# on Linux is the Sherpa gate-B story. apex is a public repo: these minutes are free.
name: hook-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: git identity for the tests' throwaway repos
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - name: install pytest
        run: python -m pip install pytest
      - name: package compiles
        run: python -m compileall -q rails hooks bin/rails bin/rails-githook
      - name: hooks.json is valid and registers only the dispatcher
        run: python -c "import json; h=json.load(open('hooks/hooks.json')); cmds={c['command'] for e in h['hooks'].values() for m in e for c in m['hooks']}; assert all('rails_hook.py' in c for c in cmds), cmds"
      - name: suite (kit tests run in kit.yml)
        run: python -m pytest tests -q --ignore=tests/kit
