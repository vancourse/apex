# --- pre-push refusals: run by rails/githooks.py, never by the dispatcher ----

[[gate]]
name = "prepush_hold"
module = "prepush"
events = ["git:pre-push"]
kind = "git_hook"
class = "lockout"
mode = "enforce"
cites = ["decision 13.2: hold is the operator's only push word", "push consent was 49% of operator messages 2026-08-07..11"]
planted = "tests/test_githooks_leak.py::test_hold_refuses_and_operator_skips_marker_and_hold_never_leak"
fp_count = 0
fp_measured_on = "n/a: fires only on the operator's own word"

[[gate]]
name = "prepush_disarm"
module = "prepush"
events = ["git:pre-push"]
kind = "git_hook"
class = "friction"
mode = "enforce"
cites = ["design section 5 row 7 and R3: a push the review does not cover takes an armed PR off auto-merge", "1.3.0 review: ship_review checks at arming; a push made while it only logs, or by the operator, merged unreviewed (morphyxAI/jarvis#2621)"]
planted = "tests/test_loop_enforcement.py::test_p2a_an_unreviewed_push_to_an_armed_pr_disarms_it"
fp_count = 0
fp_measured_on = "2026-10-09: an action, not a refusal; disarms only an armed PR whose pushed tree no receipt covers (prose-only pushes stay armed); mutants killed: call removed, coverage ignored, refused pushes disarmed, unread body rewritten"

[[gate]]
