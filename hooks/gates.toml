# The rails gate registry (plugin half). Design R19.
#
# A gate runs only if it has a row here, and a row earns its place with:
#   cites       the defects / measurements that justify it
#   planted     a hook payload (tests/planted/<file>.json) the gate MUST refuse;
#               tests/test_gates_registry.py feeds it to the dispatcher with the
#               row forced to enforce mode and fails if nothing is refused
#   fp_count    false positives measured, and fp_measured_on says where
#   class       lockout (data leaving, shared refs, another session's tree:
#               never expires on silence) | friction (deleted after 60 silent days)
#   mode        enforce | shadow (log would-deny, refuse nothing)
#   shadow_until  ISO date: shadow until then, enforce after (7 days for a new deny)
#
# Operator switches (from your own shell, never set by an agent):
#   RAILS_SHADOW_ALL=1        every gate logs instead of refusing
#   RAILS_GATES_OFF=a,b       named gates do not run

# --- session state and the operator's words --------------------------------

[[gate]]
name = "state"
module = "state"
events = ["SessionStart"]
kind = "hook"
class = "friction"
mode = "enforce"
cites = ["R30: ~124 relays; 26 claims dropped by a main-checkout release", "R20: SessionStart output budget 600 tokens"]
planted = ""
fp_count = 0
fp_measured_on = "n/a (notice only)"

[[gate]]
name = "prompt_words"
module = "prompt_words"
events = ["UserPromptSubmit"]
kind = "hook"
class = "friction"
mode = "enforce"
cites = ["decision 13.2: hold is the only push word", "R22: ceremony share 35% of operator messages"]
planted = ""
fp_count = 0
fp_measured_on = "n/a (records state, refuses nothing)"

[[gate]]
name = "receipt_writer"
module = "receipt_writer"
events = ["PostToolUse"]
tools = ["Bash", "PowerShell"]
kind = "hook"
class = "lockout"
mode = "enforce"
cites = ["R25: self-certified artifacts; 17/20 overrides", "forged = a receipt with no firing"]
planted = ""
fp_count = 0
fp_measured_on = "n/a (records, refuses nothing)"

