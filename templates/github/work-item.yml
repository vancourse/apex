name: Work item
description: A unit of work. One issue = one work item; the milestone it lands in = the release.
labels: ["work-item"]
body:
  - type: markdown
    attributes:
      value: |
        Claim a work item by **assigning yourself before you start** — assignment is
        the claim, so an unassigned open issue is genuinely unclaimed.
        Close it from the PR with `Closes #<n>` rather than by hand.

        **Set the milestone.** It is the release this work item lands in.

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Capability — new behaviour
        - Wiring / adoption — something built but consumed by nothing
        - Refactor — behaviour preserved
        - Design / decision — produces a doc or an ADR
        - Infra / CI
        - Docs
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What
      description: The work, in a few sentences. Not the implementation.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: >
        What is broken, blocked, or at risk without it. If this is a "would be nice",
        say that — it is a legitimate answer and it sets the priority honestly.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: >
        Observable conditions, one per line. "Tests pass" is not one of them —
        name what a reader could check.
      placeholder: |
        - <endpoint> returns <shape> for <case>
        - <package> is imported by <production caller>
        - the arch gate fails when <invariant> is broken
    validations:
      required: true

  - type: input
    id: wiring
    attributes:
      label: Production caller
      description: >
        Who will import or invoke this once it exists? The defect this field exists to
        catch is a capability that passes every gate and is consumed by nothing — so if
        the answer is "nothing yet", write that, and say what would change it.
      placeholder: apps/<service> — the <component> that calls it, at boot
    validations:
      required: true

  - type: input
    id: blocked_by
    attributes:
      label: Blocked by
      description: Issue numbers or a named condition. Leave empty if it is ready to start.
      placeholder: "#123, or: VAPID key unprovisioned"

  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options: ["XS", "S", "M", "L", "XL"]
    validations:
      required: true
