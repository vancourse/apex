[project]
name = "__app_kebab__"
version = "0.1.0"
description = "__App__ -- generated by `rails new`"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1",  # zoneinfo has no system database on Windows
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__app__", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ and the app root FIRST on sys.path, so a copy of this tree tests its own
# code even when run with another checkout's interpreter.
pythonpath = ["src", "."]
addopts = "--strict-markers -p no:cacheprovider"
filterwarnings = [
    # starlette 1.x nudges TestClient users toward httpx2; the suite still runs on httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "superuser(reason): the test connects as the cluster admin; the reason is required",
]
