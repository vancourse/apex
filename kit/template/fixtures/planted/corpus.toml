# The planted corpus: PLANTED values only, never real data.
#
# Seeded through the app's own write path (tests/planted_db.py), so a shape no
# production code can produce cannot be planted. Two households with entries,
# one member in a non-UTC timezone, entries straddling month boundaries in that
# timezone, entries on the last day of a month -- and a scratch household that
# write tests use, so they never disturb the corpus the parity tests read.

as_of = "2026-02-20T09:00:00Z"  # AS_OF for tests and the walk: 2026-02-20 22:00 in Auckland
walk_member = "m_aroha"

[[household]]
id = "hh_harbour"
name = "Harbour"

[[household]]
id = "hh_meadow"
name = "Meadow"

[[household]]
id = "hh_scratch"
name = "Scratch"  # no planted entries: write tests (auth matrix, caps, removal) land here

[[member]]
id = "m_aroha"
household = "hh_harbour"
display_name = "Aroha"
tz = "Pacific/Auckland"  # UTC+13 in January and February
token = "planted-aroha"

[[member]]
id = "m_sam"
household = "hh_meadow"
display_name = "Sam"
tz = "UTC"
token = "planted-sam"

[[member]]
id = "m_kit"
household = "hh_scratch"
display_name = "Kit"
tz = "UTC"
token = "planted-kit"

# recorded_at is UTC; the member's local date decides the month.

[[entry]]
member = "m_aroha"
recorded_at = "2026-01-14T21:00:00Z"  # 2026-01-15 10:00 Auckland
amount_cents = 2500
note = "rent share"

